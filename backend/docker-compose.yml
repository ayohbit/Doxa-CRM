services:
  postgres:
    image: postgres:16-alpine
    container_name: doxa-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doxa_crm
      POSTGRES_USER: doxa
      POSTGRES_PASSWORD: doxa
    ports:
      - "5432:5432"
    volumes:
      - doxa_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doxa -d doxa_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  doxa_crm_pgdata:
