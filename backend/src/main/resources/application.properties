spring.application.name=doxa-crm

server.port=8080

# PostgreSQL (local via docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/doxa_crm
spring.datasource.username=doxa
spring.datasource.password=doxa
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Garante que o Flyway rode antes do Hibernate validar o schema
spring.jpa.defer-datasource-initialization=false

logging.level.org.flywaydb=INFO

# JWT
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key-here}
app.jwt.expiration-ms=86400000

# CORS (frontend Next.js)
app.cors.allowed-origins=http://localhost:3000

# Seed demo data on startup when database is empty
app.seed.enabled=true

# Dashboard estimates (no ad platform integration yet)
app.dashboard.default-cost-per-lead=158

# Integrations (optional — configure for live Google/Telegram/Fathom)
app.frontend.url=http://localhost:3000
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.fathom.api-key=${FATHOM_API_KEY:}
app.fathom.api-base-url=${FATHOM_API_BASE_URL:https://api.fathom.video/v1}
