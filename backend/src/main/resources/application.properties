spring.application.name=doxa-crm

server.port=8080

# PostgreSQL (local via docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/doxa_crm
spring.datasource.username=doxa
spring.datasource.password=doxa
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key-here}
app.jwt.expiration-ms=86400000

# CORS (frontend Next.js)
app.cors.allowed-origins=http://localhost:3000

# Seed demo data on startup when database is empty
app.seed.enabled=true
